<svg viewBox="0 0 1010 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" style="background: var(--bg-page, #0b0b0c); font-family: var(--font-voice, system-ui, sans-serif);">
  <title id="svgtitle">Uber ride sharing class diagram</title>
  <desc id="svgdesc">UML class diagram. Trip is the central entity referencing Rider and Driver and carrying the trip state machine plus the pickup OTP. Driver emits LocationPings into a geospatial index. Payment references Trip. MatchingService ranks drivers and offers a trip; PricingService reads SurgeZone to compute the fare.</desc>

  <defs>
    <marker id="assoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.4"/>
    </marker>
  </defs>

  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" fill="none" marker-end="url(#assoc)">
    <line x1="248" y1="90" x2="212" y2="90"/>
    <line x1="248" y1="210" x2="212" y2="210"/>
    <line x1="115" y1="308" x2="115" y2="346"/>
    <line x1="528" y1="110" x2="492" y2="110"/>
    <line x1="778" y1="300" x2="742" y2="300"/>
    <path d="M860,48 L860,28 L370,28 L370,48"/>
  </g>

  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.1" fill="none" stroke-dasharray="4 4" opacity="0.7" marker-end="url(#assoc)">
    <line x1="370" y1="280" x2="370" y2="318"/>
  </g>

  <rect x="20" y="50" width="190" height="86" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="115" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Rider</text>
  <line x1="20" y1="76" x2="210" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="28" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">riderId: UUID</text>
  <text x="28" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">name, rating</text>
  <text x="28" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">defaultPaymentMethodId</text>

  <rect x="20" y="176" width="190" height="132" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="115" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Driver</text>
  <line x1="20" y1="202" x2="210" y2="202" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="28" y="217" font-size="9" fill="var(--text-secondary, #8a8a8e)">driverId: UUID</text>
  <text x="28" y="229" font-size="9" fill="var(--text-secondary, #8a8a8e)">vehicleType: SEDAN|SUV|XL</text>
  <text x="28" y="241" font-size="9" fill="var(--text-secondary, #8a8a8e)">rating, acceptRate</text>
  <text x="28" y="253" font-size="9" fill="var(--text-secondary, #8a8a8e)">currentGeohash: String</text>
  <text x="28" y="265" font-size="9" fill="var(--text-secondary, #8a8a8e)">status: OFFLINE | AVAILABLE</text>
  <text x="28" y="277" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#160;&#160;&#160;&#160;| EN_ROUTE | ON_TRIP</text>
  <text x="28" y="294" font-size="8" fill="var(--text-accent, #6c8cff)">only latest position kept, not history</text>

  <rect x="20" y="346" width="190" height="92" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="115" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">LocationPing</text>
  <line x1="20" y1="372" x2="210" y2="372" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="28" y="387" font-size="9" fill="var(--text-secondary, #8a8a8e)">driverId, lat, lng</text>
  <text x="28" y="399" font-size="9" fill="var(--text-secondary, #8a8a8e)">geohash, recordedAt</text>
  <text x="28" y="415" font-size="8" fill="var(--text-accent, #6c8cff)">a Kafka STREAM, not a table.</text>
  <text x="28" y="426" font-size="8" fill="var(--text-accent, #6c8cff)">Latest mirrored into Redis GEO.</text>

  <rect x="248" y="50" width="244" height="230" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--text-accent, #6c8cff)" stroke-width="1.8"/>
  <text x="370" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-accent, #6c8cff)">Trip</text>
  <line x1="248" y1="76" x2="492" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="256" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">tripId: UUID</text>
  <text x="256" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">riderId, driverId</text>
  <text x="256" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">status: TripStatus</text>
  <text x="256" y="127" font-size="9" fill="var(--text-secondary, #8a8a8e)">pickupLat/Lng, dropLat/Lng</text>
  <text x="256" y="139" font-size="9" fill="var(--text-secondary, #8a8a8e)">requestedAt, matchedAt</text>
  <text x="256" y="151" font-size="9" fill="var(--text-secondary, #8a8a8e)">startedAt, completedAt</text>
  <text x="256" y="163" font-size="9" fill="var(--text-secondary, #8a8a8e)">estimatedFare, finalFare</text>
  <text x="256" y="175" font-size="9" fill="var(--text-secondary, #8a8a8e)">surgeMultiplier: double</text>
  <text x="256" y="187" font-size="9" fill="var(--text-secondary, #8a8a8e)">otpCode, otpAttempts</text>
  <text x="256" y="199" font-size="9" fill="var(--text-secondary, #8a8a8e)">otpVerifiedAt: Instant?</text>
  <line x1="248" y1="207" x2="492" y2="207" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="256" y="222" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ verifyPickupOtp(code)</text>
  <text x="256" y="239" font-size="8" fill="var(--text-accent, #6c8cff)">OTP shown in the RIDER app only,</text>
  <text x="256" y="250" font-size="8" fill="var(--text-accent, #6c8cff)">typed by the driver. It gates the</text>
  <text x="256" y="261" font-size="8" fill="var(--text-accent, #6c8cff)">DRIVER_ARRIVING to IN_PROGRESS move.</text>
  <text x="256" y="274" font-size="8" fill="var(--text-accent, #6c8cff)">Single writer of status.</text>

  <rect x="248" y="318" width="244" height="102" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="370" y="334" text-anchor="middle" font-size="10" font-style="italic" fill="var(--text-accent, #6c8cff)">&#171;enum&#187;</text>
  <text x="370" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">TripStatus</text>
  <line x1="248" y1="356" x2="492" y2="356" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="256" y="371" font-size="9" fill="var(--text-secondary, #8a8a8e)">REQUESTED &#8594; MATCHED &#8594;</text>
  <text x="256" y="383" font-size="9" fill="var(--text-secondary, #8a8a8e)">DRIVER_ARRIVING &#8594; IN_PROGRESS</text>
  <text x="256" y="395" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#8594; COMPLETED | CANCELLED</text>
  <text x="256" y="411" font-size="8" fill="var(--text-accent, #6c8cff)">CANCELLED only from pre IN_PROGRESS</text>

  <rect x="528" y="50" width="212" height="130" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="634" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Payment</text>
  <line x1="528" y1="76" x2="740" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="536" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">paymentId, tripId</text>
  <text x="536" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">riderCharge: long</text>
  <text x="536" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">driverPayout: long</text>
  <text x="536" y="127" font-size="9" fill="var(--text-secondary, #8a8a8e)">platformCommission: long</text>
  <text x="536" y="139" font-size="9" fill="var(--text-secondary, #8a8a8e)">status: AUTHORIZED | CAPTURED</text>
  <text x="536" y="156" font-size="8" fill="var(--text-accent, #6c8cff)">pre auth at estimate x1.2, capture</text>
  <text x="536" y="167" font-size="8" fill="var(--text-accent, #6c8cff)">min(final, estimate) at the end</text>

  <rect x="528" y="220" width="212" height="110" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="634" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">SurgeZone</text>
  <line x1="528" y1="246" x2="740" y2="246" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="536" y="261" font-size="9" fill="var(--text-secondary, #8a8a8e)">h3CellId: String</text>
  <text x="536" y="273" font-size="9" fill="var(--text-secondary, #8a8a8e)">supplyCount, demandCount</text>
  <text x="536" y="285" font-size="9" fill="var(--text-secondary, #8a8a8e)">multiplier: double</text>
  <text x="536" y="297" font-size="9" fill="var(--text-secondary, #8a8a8e)">updatedAt</text>
  <text x="536" y="313" font-size="8" fill="var(--text-accent, #6c8cff)">H3 hexagons, not geohash rectangles:</text>
  <text x="536" y="324" font-size="8" fill="var(--text-accent, #6c8cff)">every neighbour is equidistant</text>

  <rect x="778" y="50" width="212" height="170" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="884" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">MatchingService</text>
  <line x1="778" y1="76" x2="990" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="786" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ findCandidates(pickup)</text>
  <text x="786" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ rank(candidates)</text>
  <text x="786" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ broadcastOffer(topN, ttl)</text>
  <text x="786" y="132" font-size="8" fill="var(--text-accent, #6c8cff)">GEOSEARCH 3km, widen to 5km.</text>
  <text x="786" y="143" font-size="8" fill="var(--text-accent, #6c8cff)">Rank by ETA, rating, accept rate.</text>
  <text x="786" y="160" font-size="8" fill="var(--text-accent, #6c8cff)">Offer to top 3 to 5 IN PARALLEL,</text>
  <text x="786" y="171" font-size="8" fill="var(--text-accent, #6c8cff)">first accept wins. Sequential would</text>
  <text x="786" y="182" font-size="8" fill="var(--text-accent, #6c8cff)">cost 60 to 90s; this bounds it to ~15s.</text>
  <text x="786" y="199" font-size="8" fill="var(--text-accent, #6c8cff)">Under load, switch to batch assignment</text>
  <text x="786" y="210" font-size="8" fill="var(--text-accent, #6c8cff)">(Hungarian) instead of greedy.</text>

  <rect x="778" y="260" width="212" height="150" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="884" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">PricingService</text>
  <line x1="778" y1="286" x2="990" y2="286" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="786" y="301" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ estimate(pickup, drop)</text>
  <text x="786" y="313" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ surgeFor(h3Cell): double</text>
  <text x="786" y="330" font-size="8" fill="var(--text-accent, #6c8cff)">fare = (base + perKm*km</text>
  <text x="786" y="341" font-size="8" fill="var(--text-accent, #6c8cff)">&#160;&#160;&#160;&#160;&#160;&#160;+ perMin*min) * surge</text>
  <text x="786" y="358" font-size="8" fill="var(--text-accent, #6c8cff)">multiplier = f(demand/supply),</text>
  <text x="786" y="369" font-size="8" fill="var(--text-accent, #6c8cff)">flat below 1.2, capped near 5x,</text>
  <text x="786" y="380" font-size="8" fill="var(--text-accent, #6c8cff)">recomputed per zone every 1 to 2 min</text>
  <text x="786" y="397" font-size="8" fill="var(--text-accent, #6c8cff)">Shown to the rider BEFORE confirming.</text>

  <g font-size="9" fill="var(--text-secondary, #8a8a8e)">
    <text x="20" y="470">Legend:</text>
    <line x1="70" y1="467" x2="110" y2="467" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" marker-end="url(#assoc)"/>
    <text x="116" y="470">association</text>
    <line x1="196" y1="467" x2="236" y2="467" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.7" marker-end="url(#assoc)"/>
    <text x="244" y="470">depends on enum</text>
    <text x="380" y="470" fill="var(--text-accent, #6c8cff)">accent border = Trip owns the state machine and is the single writer of status.</text>
  </g>
</svg>
