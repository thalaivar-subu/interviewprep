<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="background: var(--bg-page, #0b0b0c); font-family: var(--font-voice, system-ui, sans-serif);">
  <title id="title">Uber ride-sharing system architecture</title>
  <desc id="desc">Rider and Driver apps call an API Gateway, which routes to Location, Matching, Pricing and Trip services. These publish to a Kafka event bus consumed by Notification, Payment and Analytics/ETA services. Location writes to and Matching reads from a Redis geospatial index; Payment writes to Postgres; Analytics writes to a time-series store.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-secondary, #8a8a8e)"/>
    </marker>
  </defs>

  <!-- solid flow arrows -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="70" x2="410" y2="101"/>
    <line x1="740" y1="70" x2="550" y2="101"/>
    <line x1="480" y1="150" x2="150" y2="189"/>
    <line x1="480" y1="150" x2="370" y2="189"/>
    <line x1="480" y1="150" x2="590" y2="189"/>
    <line x1="480" y1="150" x2="810" y2="189"/>
    <line x1="135" y1="250" x2="135" y2="289"/>
    <line x1="365" y1="250" x2="365" y2="289"/>
    <line x1="595" y1="250" x2="595" y2="289"/>
    <line x1="825" y1="250" x2="825" y2="289"/>
    <line x1="365" y1="330" x2="365" y2="369"/>
    <line x1="595" y1="330" x2="595" y2="369"/>
    <line x1="825" y1="330" x2="825" y2="369"/>
    <line x1="595" y1="430" x2="595" y2="469"/>
    <line x1="825" y1="430" x2="825" y2="469"/>
  </g>

  <!-- dashed direct reads/writes to Redis GEO -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" opacity="0.7" marker-end="url(#arrow)">
    <path d="M100,250 L100,469"/>
    <path d="M365,250 L365,270 L245,270 L245,469"/>
  </g>

  <!-- Row 1: clients -->
  <g>
    <rect x="140" y="20" width="160" height="50" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="220" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Rider App</text>
    <text x="220" y="58" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">requests, tracks trip</text>

    <rect x="660" y="20" width="160" height="50" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="740" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Driver App</text>
    <text x="740" y="58" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">pings location, accepts</text>
  </g>

  <!-- Row 2: gateway -->
  <rect x="330" y="100" width="300" height="50" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="480" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">API Gateway</text>
  <text x="480" y="138" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">auth, routing, rate limit</text>

  <!-- Row 3: core services -->
  <g>
    <rect x="30" y="190" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="135" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Location Service</text>
    <text x="135" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">GPS ingest</text>

    <rect x="260" y="190" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="365" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Matching Service</text>
    <text x="365" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">rank + parallel offer</text>

    <rect x="490" y="190" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="595" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Pricing Service</text>
    <text x="595" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">fare + surge (H3)</text>

    <rect x="720" y="190" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="825" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Trip Service</text>
    <text x="825" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">state machine</text>
  </g>

  <!-- Row 4: Kafka bus -->
  <rect x="30" y="290" width="900" height="40" rx="6" fill="var(--surface-2, #1f1f22)" stroke="var(--text-accent, #6c8cff)"/>
  <text x="480" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-accent, #6c8cff)">Kafka Event Bus</text>
  <text x="480" y="322" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">driver_locations, trip_events</text>

  <!-- Row 5: consumers -->
  <g>
    <rect x="260" y="370" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="365" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Notification Svc</text>
    <text x="365" y="413" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">WS/push to apps</text>

    <rect x="490" y="370" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="595" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Payment Service</text>
    <text x="595" y="413" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">pre-auth, capture, payout</text>

    <rect x="720" y="370" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="825" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Analytics / ETA</text>
    <text x="825" y="413" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">OSRM + ML</text>
  </g>

  <!-- Row 6: data stores -->
  <g>
    <rect x="30" y="470" width="440" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="250" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Redis</text>
    <text x="250" y="513" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">GEO index + surge cache</text>

    <rect x="490" y="470" width="210" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="595" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Postgres</text>
    <text x="595" y="513" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">trips, payments</text>

    <rect x="720" y="470" width="210" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="825" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">InfluxDB/Timescale</text>
    <text x="825" y="513" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">GPS trail history</text>
  </g>
</svg>
