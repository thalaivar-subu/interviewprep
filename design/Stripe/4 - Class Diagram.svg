<svg viewBox="0 0 1010 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" style="background: var(--bg-page, #0b0b0c); font-family: var(--font-voice, system-ui, sans-serif);">
  <title id="svgtitle">Stripe payment system class diagram</title>
  <desc id="svgdesc">UML class diagram for the merchant side. Order carries the charge state machine and an optimistic lock version. PaymentIntent mirrors Stripe's own object. LedgerEntry is an append only double entry ledger. IdempotencyKey and ProcessedEvent provide deduplication for retried requests and webhooks. ReconciliationJob polls Stripe as a backstop for missed webhooks.</desc>

  <defs>
    <marker id="assoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.4"/>
    </marker>
  </defs>

  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" fill="none" marker-end="url(#assoc)">
    <line x1="116" y1="236" x2="116" y2="204"/>
    <line x1="526" y1="140" x2="492" y2="140"/>
    <path d="M528,220 L510,220 L510,320 L492,320"/>
    <path d="M560,48 L560,30 L116,30 L116,48"/>
    <path d="M760,300 L778,300 L778,120 L794,120"/>
    <path d="M794,400 L775,400 L775,450 L116,450 L116,380"/>
  </g>

  <rect x="20" y="50" width="192" height="152" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="116" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Order</text>
  <line x1="20" y1="76" x2="212" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="28" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">orderId, userId: UUID</text>
  <text x="28" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">amountMinor: long</text>
  <text x="28" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">currency: char(3)</text>
  <text x="28" y="127" font-size="9" fill="var(--text-secondary, #8a8a8e)">chargeStatus: PENDING |</text>
  <text x="28" y="139" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#160;&#160;CHARGING | CHARGED |</text>
  <text x="28" y="151" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#160;&#160;FAILED | FULFILLED</text>
  <text x="28" y="163" font-size="9" fill="var(--text-secondary, #8a8a8e)">version: int</text>
  <text x="28" y="180" font-size="8" fill="var(--text-accent, #6c8cff)">version = optimistic lock.</text>
  <text x="28" y="191" font-size="8" fill="var(--text-accent, #6c8cff)">UNIQUE(orderId, chargeStatus)</text>

  <rect x="20" y="238" width="192" height="140" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="116" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">PaymentIntent</text>
  <line x1="20" y1="264" x2="212" y2="264" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="28" y="279" font-size="9" fill="var(--text-secondary, #8a8a8e)">paymentIntentId: String</text>
  <text x="28" y="291" font-size="9" fill="var(--text-secondary, #8a8a8e)">orderId: UUID</text>
  <text x="28" y="303" font-size="9" fill="var(--text-secondary, #8a8a8e)">status, amountMinor</text>
  <text x="28" y="315" font-size="9" fill="var(--text-secondary, #8a8a8e)">currency, createdAt</text>
  <text x="28" y="332" font-size="8" fill="var(--text-accent, #6c8cff)">a MIRROR of Stripe's object, kept in</text>
  <text x="28" y="343" font-size="8" fill="var(--text-accent, #6c8cff)">its own table on purpose. Their state</text>
  <text x="28" y="354" font-size="8" fill="var(--text-accent, #6c8cff)">machine is not ours; pretending they</text>
  <text x="28" y="365" font-size="8" fill="var(--text-accent, #6c8cff)">are one is what makes reconciliation</text>
  <text x="28" y="374" font-size="8" fill="var(--text-accent, #6c8cff)">impossible.</text>

  <rect x="250" y="50" width="242" height="196" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--text-accent, #6c8cff)" stroke-width="1.8"/>
  <text x="371" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-accent, #6c8cff)">LedgerEntry</text>
  <line x1="250" y1="76" x2="492" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="258" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">ledgerEntryId: UUID</text>
  <text x="258" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">transactionId: UUID</text>
  <text x="258" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">accountId: String</text>
  <text x="258" y="127" font-size="9" fill="var(--text-secondary, #8a8a8e)">amountMinor: long</text>
  <text x="258" y="139" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#160;&#160;(+ debit, &#8722; credit)</text>
  <text x="258" y="151" font-size="9" fill="var(--text-secondary, #8a8a8e)">currency, createdAt</text>
  <text x="258" y="163" font-size="9" fill="var(--text-secondary, #8a8a8e)">description, metadata</text>
  <text x="258" y="180" font-size="8" fill="var(--text-accent, #6c8cff)">APPEND ONLY. No UPDATE, no DELETE.</text>
  <text x="258" y="191" font-size="8" fill="var(--text-accent, #6c8cff)">A mistake is fixed with a REVERSAL row,</text>
  <text x="258" y="202" font-size="8" fill="var(--text-accent, #6c8cff)">so error and correction both survive.</text>
  <text x="258" y="219" font-size="8" fill="var(--text-accent, #6c8cff)">Entries sharing a transactionId MUST</text>
  <text x="258" y="230" font-size="8" fill="var(--text-accent, #6c8cff)">sum to ZERO. That one assert catches a</text>
  <text x="258" y="241" font-size="8" fill="var(--text-accent, #6c8cff)">whole class of bugs with no domain logic.</text>

  <rect x="250" y="280" width="242" height="110" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="371" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">IdempotencyKey</text>
  <line x1="250" y1="306" x2="492" y2="306" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="258" y="321" font-size="9" fill="var(--text-secondary, #8a8a8e)">key: String (PK)</text>
  <text x="258" y="333" font-size="9" fill="var(--text-secondary, #8a8a8e)">requestHash: String</text>
  <text x="258" y="345" font-size="9" fill="var(--text-secondary, #8a8a8e)">result: JSON, createdAt</text>
  <text x="258" y="362" font-size="8" fill="var(--text-accent, #6c8cff)">generated by the CLIENT and reused</text>
  <text x="258" y="373" font-size="8" fill="var(--text-accent, #6c8cff)">across retries. A server generated key</text>
  <text x="258" y="384" font-size="8" fill="var(--text-accent, #6c8cff)">would be new each retry, missing the point.</text>

  <rect x="526" y="50" width="234" height="196" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="643" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">PaymentService</text>
  <line x1="526" y1="76" x2="760" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="534" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ charge(orderId, amount,</text>
  <text x="534" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#160;&#160;&#160;idemKey, requestHash)</text>
  <text x="534" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ record(txnId, entries)</text>
  <text x="534" y="132" font-size="8" fill="var(--text-accent, #6c8cff)">THREE overlapping defences, each</text>
  <text x="534" y="143" font-size="8" fill="var(--text-accent, #6c8cff)">covering a different failure:</text>
  <text x="534" y="156" font-size="8" fill="var(--text-accent, #6c8cff)">1. cached result on the idem key</text>
  <text x="534" y="167" font-size="8" fill="var(--text-accent, #6c8cff)">&#160;&#160;&#160;(an app level retry)</text>
  <text x="534" y="180" font-size="8" fill="var(--text-accent, #6c8cff)">2. UNIQUE(orderId, chargeStatus)</text>
  <text x="534" y="191" font-size="8" fill="var(--text-accent, #6c8cff)">&#160;&#160;&#160;(a concurrent duplicate request)</text>
  <text x="534" y="204" font-size="8" fill="var(--text-accent, #6c8cff)">3. SELECT FOR UPDATE at SERIALIZABLE</text>
  <text x="534" y="215" font-size="8" fill="var(--text-accent, #6c8cff)">&#160;&#160;&#160;(an interleaved transaction)</text>
  <text x="534" y="232" font-size="8" fill="var(--text-accent, #6c8cff)">Any one alone leaves a hole. The idem</text>
  <text x="534" y="243" font-size="8" fill="var(--text-accent, #6c8cff)">key is passed DOWNSTREAM to Stripe too.</text>

  <rect x="526" y="280" width="234" height="150" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="643" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">WebhookHandler</text>
  <line x1="526" y1="306" x2="760" y2="306" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="534" y="321" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ onWebhook(body, signature)</text>
  <text x="534" y="333" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ applyEvent(event)</text>
  <text x="534" y="350" font-size="8" fill="var(--text-accent, #6c8cff)">1. VERIFY SIGNATURE first. An</text>
  <text x="534" y="361" font-size="8" fill="var(--text-accent, #6c8cff)">&#160;&#160;&#160;unverified endpoint accepts a forged</text>
  <text x="534" y="372" font-size="8" fill="var(--text-accent, #6c8cff)">&#160;&#160;&#160;"you got paid" and ships goods free.</text>
  <text x="534" y="385" font-size="8" fill="var(--text-accent, #6c8cff)">2. dedupe on eventId</text>
  <text x="534" y="396" font-size="8" fill="var(--text-accent, #6c8cff)">3. return 200 within 5s, work async</text>
  <text x="534" y="407" font-size="8" fill="var(--text-accent, #6c8cff)">4. check state before transitioning:</text>
  <text x="534" y="418" font-size="8" fill="var(--text-accent, #6c8cff)">&#160;&#160;&#160;events arrive OUT OF ORDER.</text>

  <rect x="794" y="50" width="196" height="130" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="892" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">ProcessedEvent</text>
  <line x1="794" y1="76" x2="990" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="802" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">eventId: String (PK)</text>
  <text x="802" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">processedAt: Instant</text>
  <text x="802" y="120" font-size="8" fill="var(--text-accent, #6c8cff)">the PRIMARY KEY does the dedupe.</text>
  <text x="802" y="131" font-size="8" fill="var(--text-accent, #6c8cff)">No application logic needed.</text>
  <text x="802" y="148" font-size="8" fill="var(--text-accent, #6c8cff)">Webhooks are at least once and</text>
  <text x="802" y="159" font-size="8" fill="var(--text-accent, #6c8cff)">unordered, so the same event WILL</text>
  <text x="802" y="170" font-size="8" fill="var(--text-accent, #6c8cff)">arrive more than once.</text>

  <rect x="794" y="215" width="196" height="215" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="892" y="233" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">ReconciliationJob</text>
  <line x1="794" y1="241" x2="990" y2="241" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="802" y="256" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ reconcile(date)</text>
  <text x="802" y="268" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ sweep()</text>
  <text x="802" y="285" font-size="8" fill="var(--text-accent, #6c8cff)">DAILY: pull the settlement report,</text>
  <text x="802" y="296" font-size="8" fill="var(--text-accent, #6c8cff)">match on paymentIntentId, flag</text>
  <text x="802" y="307" font-size="8" fill="var(--text-accent, #6c8cff)">missing in ledger / missing in Stripe /</text>
  <text x="802" y="318" font-size="8" fill="var(--text-accent, #6c8cff)">amount or status mismatch.</text>
  <text x="802" y="335" font-size="8" fill="var(--text-accent, #6c8cff)">EVERY 5 MIN: poll recent intents.</text>
  <text x="802" y="352" font-size="8" fill="var(--text-accent, #6c8cff)">This exists because a push channel is</text>
  <text x="802" y="363" font-size="8" fill="var(--text-accent, #6c8cff)">an OPTIMISATION, never a source of</text>
  <text x="802" y="374" font-size="8" fill="var(--text-accent, #6c8cff)">truth. Stripe cannot detect a bug that</text>
  <text x="802" y="385" font-size="8" fill="var(--text-accent, #6c8cff)">happens after your handler returned 200.</text>
  <text x="802" y="402" font-size="8" fill="var(--text-accent, #6c8cff)">Unresolved &#62; 24h escalates. A recon job</text>
  <text x="802" y="413" font-size="8" fill="var(--text-accent, #6c8cff)">nobody reads is worse than none: it</text>
  <text x="802" y="424" font-size="8" fill="var(--text-accent, #6c8cff)">manufactures false confidence.</text>

  <g font-size="9" fill="var(--text-secondary, #8a8a8e)">
    <text x="20" y="478">Legend:</text>
    <line x1="70" y1="475" x2="110" y2="475" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" marker-end="url(#assoc)"/>
    <text x="116" y="478">association</text>
    <text x="210" y="478" fill="var(--text-accent, #6c8cff)">accent border = LedgerEntry. Append only with derived balances is the entire correctness argument.</text>
  </g>
</svg>
