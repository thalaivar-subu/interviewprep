<svg viewBox="0 0 1060 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" style="background: var(--bg-page, #0b0b0c); font-family: var(--font-voice, system-ui, sans-serif);">
  <title id="svgtitle">BookMyShow class diagram</title>
  <desc id="svgdesc">UML class diagram. Theatre composes Screens which compose Seats. Show references a Movie and a Screen. ShowSeat is the bookable inventory unit, referencing both Show and Seat, and carries the lock status and expiry. Booking references User and one or more ShowSeats; Payment references Booking. PricingStrategy is an interface realized by WeekendPricing and SeatTypePricing, used by BookingService.</desc>

  <defs>
    <marker id="assoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.4"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 10" refX="0" refY="5" markerWidth="13" markerHeight="11" orient="auto">
      <path d="M0,5 L6,1 L12,5 L6,9 z" fill="var(--text-secondary, #8a8a8e)"/>
    </marker>
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="var(--bg-page, #0b0b0c)" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ===== relationships drawn first so boxes sit on top ===== -->

  <!-- composition: Theatre owns Screens, Screen owns Seats -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.4" fill="none">
    <line x1="105" y1="126" x2="105" y2="166" marker-start="url(#diamond)"/>
    <line x1="105" y1="242" x2="105" y2="282" marker-start="url(#diamond)"/>
  </g>

  <!-- associations -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" fill="none" marker-end="url(#assoc)">
    <line x1="335" y1="180" x2="335" y2="142"/>
    <line x1="240" y1="205" x2="192" y2="192"/>
    <line x1="345" y1="324" x2="345" y2="286"/>
    <path d="M240,360 L215,360 L215,334 L192,334"/>
    <line x1="615" y1="180" x2="615" y2="128"/>
    <path d="M510,250 L480,250 L480,368 L452,368"/>
    <path d="M510,520 L480,520 L480,314 L510,314"/>
    <path d="M780,340 L752,340 L752,250 L722,250"/>
    <path d="M1010,300 L1040,300 L1040,92 L1012,92"/>
  </g>

  <!-- realization: the two pricing strategies implement the interface -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" fill="none" stroke-dasharray="6 4" marker-end="url(#triangle)">
    <line x1="825" y1="174" x2="825" y2="136"/>
    <line x1="962" y1="174" x2="962" y2="136"/>
  </g>

  <!-- dependency on enums -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.1" fill="none" stroke-dasharray="4 4" opacity="0.7" marker-end="url(#assoc)">
    <line x1="105" y1="386" x2="105" y2="426"/>
    <line x1="345" y1="474" x2="345" y2="514"/>
    <line x1="615" y1="312" x2="615" y2="352"/>
  </g>

  <!-- multiplicity labels -->
  <g font-size="9" fill="var(--text-secondary, #8a8a8e)">
    <text x="112" y="150">1..*</text>
    <text x="112" y="266">1..*</text>
    <text x="458" y="362">1..*</text>
  </g>

  <!-- ===== VENUE column ===== -->
  <g>
    <rect x="20" y="50" width="170" height="76" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="105" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Theatre</text>
    <line x1="20" y1="76" x2="190" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="28" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">theatreId: UUID</text>
    <text x="28" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">name, cityId</text>
    <text x="28" y="118" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ getScreens()</text>

    <rect x="20" y="166" width="170" height="76" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="105" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Screen</text>
    <line x1="20" y1="192" x2="190" y2="192" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="28" y="207" font-size="9" fill="var(--text-secondary, #8a8a8e)">screenId: UUID</text>
    <text x="28" y="219" font-size="9" fill="var(--text-secondary, #8a8a8e)">name</text>
    <text x="28" y="234" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ getSeats()</text>

    <rect x="20" y="282" width="170" height="104" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="105" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Seat</text>
    <line x1="20" y1="308" x2="190" y2="308" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="28" y="323" font-size="9" fill="var(--text-secondary, #8a8a8e)">seatId: UUID</text>
    <text x="28" y="335" font-size="9" fill="var(--text-secondary, #8a8a8e)">row: char, number: int</text>
    <text x="28" y="347" font-size="9" fill="var(--text-secondary, #8a8a8e)">type: SeatType</text>
    <text x="28" y="359" font-size="9" fill="var(--text-secondary, #8a8a8e)">basePrice: Money</text>
    <text x="28" y="376" font-size="8" fill="var(--text-accent, #6c8cff)">physical furniture, not inventory</text>

    <rect x="20" y="426" width="170" height="76" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="105" y="442" text-anchor="middle" font-size="10" font-style="italic" fill="var(--text-accent, #6c8cff)">&#171;enum&#187;</text>
    <text x="105" y="456" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">SeatType</text>
    <line x1="20" y1="464" x2="190" y2="464" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="28" y="479" font-size="9" fill="var(--text-secondary, #8a8a8e)">REGULAR, PREMIUM</text>
    <text x="28" y="491" font-size="9" fill="var(--text-secondary, #8a8a8e)">RECLINER</text>
  </g>

  <!-- ===== CATALOG + INVENTORY column ===== -->
  <g>
    <rect x="240" y="50" width="190" height="92" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="335" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Movie</text>
    <line x1="240" y1="76" x2="430" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="248" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">movieId: UUID</text>
    <text x="248" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">title, language, genre</text>
    <text x="248" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">durationMins: int</text>
    <text x="248" y="127" font-size="9" fill="var(--text-secondary, #8a8a8e)">certification</text>

    <rect x="240" y="180" width="190" height="106" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="335" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Show</text>
    <line x1="240" y1="206" x2="430" y2="206" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="248" y="221" font-size="9" fill="var(--text-secondary, #8a8a8e)">showId: UUID</text>
    <text x="248" y="233" font-size="9" fill="var(--text-secondary, #8a8a8e)">startTime, endTime</text>
    <text x="248" y="245" font-size="9" fill="var(--text-secondary, #8a8a8e)">priceMultiplier: double</text>
    <text x="248" y="262" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ getSeatMap()</text>
    <text x="248" y="277" font-size="8" fill="var(--text-accent, #6c8cff)">one movie on one screen, one time</text>

    <rect x="240" y="324" width="212" height="150" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--text-accent, #6c8cff)" stroke-width="1.8"/>
    <text x="346" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-accent, #6c8cff)">ShowSeat</text>
    <line x1="240" y1="350" x2="452" y2="350" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="248" y="365" font-size="9" fill="var(--text-secondary, #8a8a8e)">showSeatId: UUID</text>
    <text x="248" y="377" font-size="9" fill="var(--text-secondary, #8a8a8e)">status: SeatStatus</text>
    <text x="248" y="389" font-size="9" fill="var(--text-secondary, #8a8a8e)">lockedByUserId: UUID?</text>
    <text x="248" y="401" font-size="9" fill="var(--text-secondary, #8a8a8e)">lockExpiresAt: Instant?</text>
    <text x="248" y="413" font-size="9" fill="var(--text-secondary, #8a8a8e)">price: Money</text>
    <line x1="240" y1="421" x2="452" y2="421" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="248" y="436" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ isAvailable(now): bool</text>
    <text x="248" y="448" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ lock(userId, ttl)</text>
    <text x="248" y="465" font-size="8" fill="var(--text-accent, #6c8cff)">THE bookable unit. UNIQUE(showId, seatId)</text>

    <rect x="240" y="514" width="212" height="76" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="346" y="530" text-anchor="middle" font-size="10" font-style="italic" fill="var(--text-accent, #6c8cff)">&#171;enum&#187;</text>
    <text x="346" y="544" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">SeatStatus</text>
    <line x1="240" y1="552" x2="452" y2="552" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="248" y="567" font-size="9" fill="var(--text-secondary, #8a8a8e)">AVAILABLE, LOCKED, BOOKED</text>
    <text x="248" y="580" font-size="8" fill="var(--text-accent, #6c8cff)">LOCKED past TTL reads as AVAILABLE</text>
  </g>

  <!-- ===== TRANSACTION column ===== -->
  <g>
    <rect x="510" y="50" width="210" height="78" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="615" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">User</text>
    <line x1="510" y1="76" x2="720" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="518" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">userId: UUID</text>
    <text x="518" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">name, email, phone</text>
    <text x="518" y="118" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ getBookings()</text>

    <rect x="510" y="180" width="210" height="132" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="615" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Booking</text>
    <line x1="510" y1="206" x2="720" y2="206" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="518" y="221" font-size="9" fill="var(--text-secondary, #8a8a8e)">bookingId: UUID</text>
    <text x="518" y="233" font-size="9" fill="var(--text-secondary, #8a8a8e)">status: BookingStatus</text>
    <text x="518" y="245" font-size="9" fill="var(--text-secondary, #8a8a8e)">totalAmount: Money</text>
    <text x="518" y="257" font-size="9" fill="var(--text-secondary, #8a8a8e)">idempotencyKey: String</text>
    <line x1="510" y1="265" x2="720" y2="265" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="518" y="280" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ confirm(payment)</text>
    <text x="518" y="292" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ cancel()</text>
    <text x="518" y="305" font-size="8" fill="var(--text-accent, #6c8cff)">covers 1..* ShowSeat</text>

    <rect x="510" y="352" width="210" height="76" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="615" y="368" text-anchor="middle" font-size="10" font-style="italic" fill="var(--text-accent, #6c8cff)">&#171;enum&#187;</text>
    <text x="615" y="382" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">BookingStatus</text>
    <line x1="510" y1="390" x2="720" y2="390" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="518" y="405" font-size="9" fill="var(--text-secondary, #8a8a8e)">PENDING, CONFIRMED</text>
    <text x="518" y="417" font-size="9" fill="var(--text-secondary, #8a8a8e)">CANCELLED, EXPIRED</text>

    <rect x="510" y="468" width="210" height="104" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="615" y="486" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Payment</text>
    <line x1="510" y1="494" x2="720" y2="494" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="518" y="509" font-size="9" fill="var(--text-secondary, #8a8a8e)">paymentId: UUID</text>
    <text x="518" y="521" font-size="9" fill="var(--text-secondary, #8a8a8e)">amount: Money</text>
    <text x="518" y="533" font-size="9" fill="var(--text-secondary, #8a8a8e)">method, status</text>
    <text x="518" y="545" font-size="9" fill="var(--text-secondary, #8a8a8e)">idempotencyKey: String</text>
    <text x="518" y="562" font-size="8" fill="var(--text-accent, #6c8cff)">retriable, never double charges</text>
  </g>

  <!-- ===== STRATEGY + SERVICE column ===== -->
  <g>
    <rect x="780" y="50" width="232" height="86" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--text-accent, #6c8cff)" stroke-width="1.6"/>
    <text x="896" y="68" text-anchor="middle" font-size="10" font-style="italic" fill="var(--text-accent, #6c8cff)">&#171;interface&#187;</text>
    <text x="896" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">PricingStrategy</text>
    <line x1="780" y1="91" x2="1012" y2="91" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="788" y="106" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ priceFor(show, seat): Money</text>
    <text x="788" y="123" font-size="8" fill="var(--text-accent, #6c8cff)">new pricing rule = new class, no edits</text>

    <rect x="770" y="174" width="112" height="56" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="826" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-primary, #f2f2f3)">WeekendPricing</text>
    <line x1="770" y1="200" x2="882" y2="200" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="778" y="215" font-size="8" fill="var(--text-secondary, #8a8a8e)">+ priceFor(...)</text>

    <rect x="900" y="174" width="125" height="56" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="962" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-primary, #f2f2f3)">SeatTypePricing</text>
    <line x1="900" y1="200" x2="1025" y2="200" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="908" y="215" font-size="8" fill="var(--text-secondary, #8a8a8e)">+ priceFor(...)</text>

    <rect x="780" y="270" width="232" height="170" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="896" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">BookingService</text>
    <line x1="780" y1="296" x2="1012" y2="296" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="788" y="311" font-size="9" fill="var(--text-secondary, #8a8a8e)">- pricing: PricingStrategy</text>
    <line x1="780" y1="319" x2="1012" y2="319" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="788" y="334" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ lockSeats(showId, seatIds,</text>
    <text x="788" y="346" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#160;&#160;&#160;userId, ttl)</text>
    <text x="788" y="362" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ createBooking(..., idemKey)</text>
    <text x="788" y="374" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ confirmBooking(id, payment)</text>
    <text x="788" y="386" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ releaseExpiredLocks()</text>
    <text x="788" y="404" font-size="8" fill="var(--text-accent, #6c8cff)">lockSeats sorts seatIds before</text>
    <text x="788" y="415" font-size="8" fill="var(--text-accent, #6c8cff)">SELECT FOR UPDATE, so two</text>
    <text x="788" y="426" font-size="8" fill="var(--text-accent, #6c8cff)">concurrent bookings cannot deadlock</text>
  </g>

  <!-- legend -->
  <g font-size="9" fill="var(--text-secondary, #8a8a8e)">
    <text x="20" y="620">Legend:</text>
    <line x1="70" y1="617" x2="110" y2="617" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.4" marker-start="url(#diamond)"/>
    <text x="116" y="620">composition (owns)</text>
    <line x1="230" y1="617" x2="270" y2="617" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" marker-end="url(#assoc)"/>
    <text x="276" y="620">association (references)</text>
    <line x1="410" y1="617" x2="450" y2="617" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#triangle)"/>
    <text x="460" y="620">realizes interface</text>
    <line x1="580" y1="617" x2="620" y2="617" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.7" marker-end="url(#assoc)"/>
    <text x="626" y="620">depends on enum</text>
    <text x="760" y="620" fill="var(--text-accent, #6c8cff)">accent border = the class the whole design turns on</text>
  </g>
</svg>
