<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" style="background: var(--bg-page, #0b0b0c); font-family: var(--font-voice, system-ui, sans-serif);">
  <title id="svgtitle">Netflix video streaming architecture</title>
  <desc id="svgdesc">Two planes. On the ingest side a studio master goes to a transcoding fleet driven by a job queue, producing a ladder of segments in object storage that is pre-positioned onto Open Connect appliances. On the playback side clients call an API gateway routing to Playback, DRM and Recommendation services, then stream segments directly from the nearest Open Connect appliance over plain HTTP, bypassing the control plane entirely.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-secondary, #8a8a8e)"/>
    </marker>
  </defs>

  <!-- solid: control plane request path and ingest pipeline -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="165" y1="80" x2="165" y2="129"/>
    <line x1="165" y1="190" x2="165" y2="239"/>
    <line x1="165" y1="300" x2="165" y2="349"/>
    <line x1="700" y1="55" x2="700" y2="99"/>
    <line x1="700" y1="150" x2="560" y2="189"/>
    <line x1="700" y1="150" x2="700" y2="189"/>
    <line x1="700" y1="150" x2="840" y2="189"/>
    <line x1="620" y1="250" x2="620" y2="349"/>
  </g>

  <!-- dashed: bulk data plane. Segment bytes never traverse the control plane. -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" opacity="0.75" marker-end="url(#arrow)">
    <path d="M300,375 L460,375"/>
    <path d="M780,349 L780,60 L800,60"/>
  </g>

  <!-- INGEST column label -->
  <text x="165" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-accent, #6c8cff)">INGEST (offline, pre-computed)</text>

  <rect x="30" y="46" width="270" height="34" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="165" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Studio Master (4K, 50GB)</text>

  <rect x="30" y="130" width="270" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="165" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Transcode Fleet</text>
  <text x="165" y="173" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">GPU workers, one job per rung</text>

  <rect x="30" y="240" width="270" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="165" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">S3 Segment Store</text>
  <text x="165" y="283" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">~120 streams per title</text>

  <rect x="30" y="350" width="270" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="165" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Pre-positioning</text>
  <text x="165" y="393" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">pushed before release</text>

  <!-- PLAYBACK column label -->
  <text x="700" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-accent, #6c8cff)">PLAYBACK (online, control plane)</text>

  <rect x="600" y="46" width="200" height="50" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="700" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Client Player</text>
  <text x="700" y="84" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">runs ABR loop</text>

  <rect x="560" y="100" width="280" height="50" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="700" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">API Gateway (Zuul)</text>
  <text x="700" y="138" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">auth, routing, circuit break</text>

  <rect x="470" y="190" width="180" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="560" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Playback Svc</text>
  <text x="560" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">manifest, picks OCA</text>

  <rect x="665" y="190" width="140" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="735" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">DRM Svc</text>
  <text x="735" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">session keys</text>

  <rect x="820" y="190" width="110" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="875" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Recs</text>
  <text x="875" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">ranked rows</text>

  <!-- Data plane: OCA -->
  <rect x="460" y="350" width="340" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--text-accent, #6c8cff)"/>
  <text x="630" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-accent, #6c8cff)">Open Connect Appliance</text>
  <text x="630" y="393" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">inside the ISP, 100+ TB SSD</text>

  <!-- Bottom band: shared infra -->
  <rect x="30" y="460" width="440" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="250" y="486" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Kafka</text>
  <text x="250" y="503" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">viewing events, async fan-out</text>

  <rect x="490" y="460" width="440" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="710" y="486" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Cassandra / MySQL</text>
  <text x="710" y="503" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">profiles, history, billing</text>

  <!-- legend -->
  <text x="30" y="548" font-size="10" fill="var(--text-secondary, #8a8a8e)">Solid = control plane and ingest.  Dashed = bulk video bytes: pre-positioned to the edge, then streamed to the player without touching the control plane.</text>
</svg>
