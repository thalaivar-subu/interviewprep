<svg viewBox="0 0 1010 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" style="background: var(--bg-page, #0b0b0c); font-family: var(--font-voice, system-ui, sans-serif);">
  <title id="svgtitle">Splitwise class diagram</title>
  <desc id="svgdesc">UML class diagram. Group composes GroupMembers referencing Users. Expense composes ExpenseParticipants and uses a SplitStrategy selected by SplitType. Balance is a materialized view derived from expenses and settlements. Settlement reduces a Balance. DebtSimplifier reads balances to produce a minimal payment set.</desc>

  <defs>
    <marker id="assoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.4"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 10" refX="0" refY="5" markerWidth="13" markerHeight="11" orient="auto">
      <path d="M0,5 L6,1 L12,5 L6,9 z" fill="var(--text-secondary, #8a8a8e)"/>
    </marker>
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="var(--bg-page, #0b0b0c)" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.2"/>
    </marker>
  </defs>

  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.4" fill="none">
    <line x1="110" y1="262" x2="110" y2="302" marker-start="url(#diamond)"/>
    <line x1="345" y1="200" x2="345" y2="240" marker-start="url(#diamond)"/>
  </g>

  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" fill="none" marker-end="url(#assoc)">
    <path d="M20,340 L10,340 L10,93 L18,93"/>
    <path d="M240,140 L220,140 L220,200 L204,200"/>
    <path d="M240,180 L228,180 L228,404 L238,404"/>
    <line x1="595" y1="230" x2="595" y2="192"/>
    <path d="M400,48 L400,26 L870,26 L870,48"/>
    <path d="M748,300 L730,300 L730,120 L702,120"/>
  </g>

  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" fill="none" stroke-dasharray="6 4">
    <line x1="802" y1="176" x2="802" y2="138" marker-end="url(#triangle)"/>
    <line x1="932" y1="176" x2="932" y2="138" marker-end="url(#triangle)"/>
    <line x1="450" y1="110" x2="488" y2="110" marker-end="url(#assoc)"/>
  </g>

  <g font-size="8" fill="var(--text-secondary, #8a8a8e)">
    <text x="455" y="104">&#171;derived from&#187;</text>
    <text x="352" y="232">1..*</text>
    <text x="117" y="290">1..*</text>
  </g>

  <rect x="20" y="50" width="180" height="86" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="110" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">User</text>
  <line x1="20" y1="76" x2="200" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="28" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">userId: UUID</text>
  <text x="28" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">name, email, phone</text>
  <text x="28" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">defaultCurrency</text>
  <text x="28" y="127" font-size="9" fill="var(--text-secondary, #8a8a8e)">paymentMethods</text>

  <rect x="20" y="176" width="180" height="86" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="110" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Group</text>
  <line x1="20" y1="202" x2="200" y2="202" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="28" y="217" font-size="9" fill="var(--text-secondary, #8a8a8e)">groupId: UUID</text>
  <text x="28" y="229" font-size="9" fill="var(--text-secondary, #8a8a8e)">name</text>
  <text x="28" y="241" font-size="9" fill="var(--text-secondary, #8a8a8e)">type: APARTMENT | TRIP</text>
  <text x="28" y="253" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#160;&#160;&#160;&#160;&#160;| COUPLE | OTHER</text>

  <rect x="20" y="302" width="180" height="76" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="110" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">GroupMember</text>
  <line x1="20" y1="328" x2="200" y2="328" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="28" y="343" font-size="9" fill="var(--text-secondary, #8a8a8e)">groupId, userId</text>
  <text x="28" y="355" font-size="9" fill="var(--text-secondary, #8a8a8e)">joinedAt, leftAt?</text>
  <text x="28" y="370" font-size="8" fill="var(--text-accent, #6c8cff)">leftAt NULL = active</text>

  <rect x="240" y="50" width="210" height="150" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="345" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Expense</text>
  <line x1="240" y1="76" x2="450" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="248" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">expenseId: UUID</text>
  <text x="248" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">groupId, payerId</text>
  <text x="248" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">amountMinor: long</text>
  <text x="248" y="127" font-size="9" fill="var(--text-secondary, #8a8a8e)">currency, category</text>
  <text x="248" y="139" font-size="9" fill="var(--text-secondary, #8a8a8e)">splitType: SplitType</text>
  <text x="248" y="151" font-size="9" fill="var(--text-secondary, #8a8a8e)">version: int</text>
  <text x="248" y="168" font-size="8" fill="var(--text-accent, #6c8cff)">append only. Edits create a new</text>
  <text x="248" y="179" font-size="8" fill="var(--text-accent, #6c8cff)">version, never mutate in place.</text>
  <text x="248" y="192" font-size="8" fill="var(--text-accent, #6c8cff)">Integer cents, never float.</text>

  <rect x="240" y="240" width="210" height="86" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="345" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">ExpenseParticipant</text>
  <line x1="240" y1="266" x2="450" y2="266" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="248" y="281" font-size="9" fill="var(--text-secondary, #8a8a8e)">expenseId, userId</text>
  <text x="248" y="293" font-size="9" fill="var(--text-secondary, #8a8a8e)">shareAmount: long</text>
  <text x="248" y="309" font-size="8" fill="var(--text-accent, #6c8cff)">precomputed at write time, so all 5</text>
  <text x="248" y="320" font-size="8" fill="var(--text-accent, #6c8cff)">split types collapse to one shape</text>

  <rect x="240" y="366" width="210" height="76" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="345" y="382" text-anchor="middle" font-size="10" font-style="italic" fill="var(--text-accent, #6c8cff)">&#171;enum&#187;</text>
  <text x="345" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">SplitType</text>
  <line x1="240" y1="404" x2="450" y2="404" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="248" y="419" font-size="9" fill="var(--text-secondary, #8a8a8e)">EQUAL, EXACT, PERCENTAGE</text>
  <text x="248" y="431" font-size="9" fill="var(--text-secondary, #8a8a8e)">SHARES, ITEMIZED</text>

  <rect x="488" y="50" width="212" height="140" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--text-accent, #6c8cff)" stroke-width="1.8"/>
  <text x="594" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-accent, #6c8cff)">Balance</text>
  <line x1="488" y1="76" x2="700" y2="76" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="496" y="91" font-size="9" fill="var(--text-secondary, #8a8a8e)">groupId</text>
  <text x="496" y="103" font-size="9" fill="var(--text-secondary, #8a8a8e)">userA, userB: UUID</text>
  <text x="496" y="115" font-size="9" fill="var(--text-secondary, #8a8a8e)">netAmount: long</text>
  <line x1="488" y1="123" x2="700" y2="123" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="496" y="138" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ applyDelta(delta)</text>
  <text x="496" y="155" font-size="8" fill="var(--text-accent, #6c8cff)">keyed (min, max) so ONE row per</text>
  <text x="496" y="166" font-size="8" fill="var(--text-accent, #6c8cff)">pair. Two rows could drift apart.</text>
  <text x="496" y="180" font-size="8" fill="var(--text-accent, #6c8cff)">Materialized, recomputable from ledger.</text>

  <rect x="488" y="230" width="212" height="150" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="594" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">Settlement</text>
  <line x1="488" y1="256" x2="700" y2="256" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="496" y="271" font-size="9" fill="var(--text-secondary, #8a8a8e)">settlementId: UUID</text>
  <text x="496" y="283" font-size="9" fill="var(--text-secondary, #8a8a8e)">fromUser, toUser</text>
  <text x="496" y="295" font-size="9" fill="var(--text-secondary, #8a8a8e)">amount, currency</text>
  <text x="496" y="307" font-size="9" fill="var(--text-secondary, #8a8a8e)">method: CASH | PAYPAL...</text>
  <text x="496" y="319" font-size="9" fill="var(--text-secondary, #8a8a8e)">status: PENDING | COMPLETED</text>
  <text x="496" y="331" font-size="9" fill="var(--text-secondary, #8a8a8e)">idempotencyKey: String</text>
  <text x="496" y="348" font-size="8" fill="var(--text-accent, #6c8cff)">retry with the SAME key replays the</text>
  <text x="496" y="359" font-size="8" fill="var(--text-accent, #6c8cff)">cached result, never double charges</text>

  <rect x="488" y="420" width="212" height="76" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="594" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">ExchangeRate</text>
  <line x1="488" y1="446" x2="700" y2="446" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="496" y="461" font-size="9" fill="var(--text-secondary, #8a8a8e)">date, fromCcy, toCcy, rate</text>
  <text x="496" y="477" font-size="8" fill="var(--text-accent, #6c8cff)">rate on the EXPENSE date, so old</text>
  <text x="496" y="488" font-size="8" fill="var(--text-accent, #6c8cff)">expenses do not drift as FX moves</text>

  <rect x="745" y="50" width="245" height="88" rx="4" fill="var(--surface-2, #1f1f22)" stroke="var(--text-accent, #6c8cff)" stroke-width="1.6"/>
  <text x="867" y="68" text-anchor="middle" font-size="10" font-style="italic" fill="var(--text-accent, #6c8cff)">&#171;interface&#187; &#183; Strategy</text>
  <text x="867" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">SplitStrategy</text>
  <line x1="745" y1="92" x2="990" y2="92" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="753" y="107" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ split(total, participants)</text>
  <text x="753" y="119" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#160;&#160;&#160;: List&#60;(userId, share)&#62;</text>
  <text x="753" y="133" font-size="8" fill="var(--text-accent, #6c8cff)">all 5 return the same shape</text>

  <rect x="745" y="176" width="115" height="56" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="802" y="194" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-primary, #f2f2f3)">EqualSplit</text>
  <line x1="745" y1="202" x2="860" y2="202" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="753" y="217" font-size="8" fill="var(--text-secondary, #8a8a8e)">+ split(...)</text>

  <rect x="875" y="176" width="115" height="56" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="932" y="194" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-primary, #f2f2f3)">SharesSplit</text>
  <line x1="875" y1="202" x2="990" y2="202" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="883" y="217" font-size="8" fill="var(--text-secondary, #8a8a8e)">+ split(...)</text>

  <rect x="745" y="272" width="245" height="150" rx="4" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="867" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary, #f2f2f3)">DebtSimplifier</text>
  <line x1="745" y1="298" x2="990" y2="298" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="753" y="313" font-size="9" fill="var(--text-secondary, #8a8a8e)">+ simplify(netBalances)</text>
  <text x="753" y="325" font-size="9" fill="var(--text-secondary, #8a8a8e)">&#160;&#160;&#160;: List&#60;Payment&#62;</text>
  <text x="753" y="342" font-size="8" fill="var(--text-accent, #6c8cff)">greedy: match max creditor with</text>
  <text x="753" y="353" font-size="8" fill="var(--text-accent, #6c8cff)">max debtor, transfer the min of the</text>
  <text x="753" y="364" font-size="8" fill="var(--text-accent, #6c8cff)">two, repeat until all are zero.</text>
  <text x="753" y="381" font-size="8" fill="var(--text-accent, #6c8cff)">Minimum transaction count is NP-hard,</text>
  <text x="753" y="392" font-size="8" fill="var(--text-accent, #6c8cff)">so greedy is deliberate: near optimal.</text>
  <text x="753" y="409" font-size="8" fill="var(--text-accent, #6c8cff)">5 people: ~10 IOUs collapse to ~4.</text>

  <g font-size="9" fill="var(--text-secondary, #8a8a8e)">
    <text x="20" y="530">Legend:</text>
    <line x1="70" y1="527" x2="110" y2="527" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.4" marker-start="url(#diamond)"/>
    <text x="116" y="530">composition</text>
    <line x1="190" y1="527" x2="230" y2="527" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" marker-end="url(#assoc)"/>
    <text x="236" y="530">association</text>
    <line x1="310" y1="527" x2="350" y2="527" stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#triangle)"/>
    <text x="358" y="530">realizes</text>
    <text x="430" y="530" fill="var(--text-accent, #6c8cff)">accent border = Balance is a derived view, not a source of truth. That is the whole design.</text>
  </g>
</svg>
