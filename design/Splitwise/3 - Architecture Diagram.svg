<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" style="background: var(--bg-page, #0b0b0c); font-family: var(--font-voice, system-ui, sans-serif);">
  <title id="svgtitle">Splitwise system architecture</title>
  <desc id="svgdesc">A client app calls an API Gateway, which routes to Group, Expense, Balance and Settlement services. Expense, Balance and Settlement publish to an event bus consumed by the Notification service. Settlement calls an external Payment Gateway directly, bypassing the bus. Services share Postgres for expenses, balances and settlements; Redis holds the FX rate cache.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-secondary, #8a8a8e)"/>
    </marker>
  </defs>

  <!-- solid: primary request path + event publishes -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="480" y1="70" x2="480" y2="99"/>
    <line x1="480" y1="150" x2="150" y2="189"/>
    <line x1="480" y1="150" x2="370" y2="189"/>
    <line x1="480" y1="150" x2="590" y2="189"/>
    <line x1="480" y1="150" x2="810" y2="189"/>
    <line x1="400" y1="250" x2="400" y2="289"/>
    <line x1="595" y1="250" x2="595" y2="289"/>
    <path d="M780,250 L780,270 L670,270 L670,289"/>
    <line x1="365" y1="330" x2="365" y2="369"/>
  </g>

  <!-- dashed: direct calls that bypass the event bus. Routed through the clear channels
       at x=250 (left of the bus) and x=710/870 (right of it) so they never cross the bus band. -->
  <g stroke="var(--text-secondary, #8a8a8e)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" opacity="0.75" marker-end="url(#arrow)">
    <path d="M320,250 L320,265 L250,265 L250,469"/>
    <path d="M700,235 L710,235 L710,450 L825,450 L825,469"/>
    <line x1="870" y1="250" x2="870" y2="369"/>
  </g>

  <!-- Row 1: client -->
  <rect x="400" y="20" width="160" height="50" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="480" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Client App</text>
  <text x="480" y="58" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">web / mobile</text>

  <!-- Row 2: gateway -->
  <rect x="330" y="100" width="300" height="50" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
  <text x="480" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">API Gateway</text>
  <text x="480" y="138" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">auth, routing, rate limit</text>

  <!-- Row 3: core services -->
  <g>
    <rect x="30" y="190" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="135" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Group Service</text>
    <text x="135" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">members, group type</text>

    <rect x="260" y="190" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="365" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Expense Service</text>
    <text x="365" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">splits, ledger write</text>

    <rect x="490" y="190" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="595" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Balance Service</text>
    <text x="595" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">netting + simplification</text>

    <rect x="720" y="190" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="825" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Settlement Service</text>
    <text x="825" y="233" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">payouts, idempotent</text>
  </g>

  <!-- Row 4: event bus (deliberately stops short of the Settlement column) -->
  <rect x="260" y="290" width="440" height="40" rx="6" fill="var(--surface-2, #1f1f22)" stroke="var(--text-accent, #6c8cff)"/>
  <text x="480" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-accent, #6c8cff)">Event Bus</text>
  <text x="480" y="322" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">expense_added, settlement_*</text>

  <!-- Row 5: consumer + external -->
  <g>
    <rect x="260" y="370" width="210" height="60" rx="8" fill="var(--surface-1, #17171a)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="365" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Notification Svc</text>
    <text x="365" y="413" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">WS/push to apps</text>

    <rect x="720" y="370" width="210" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="825" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Payment Gateway</text>
    <text x="825" y="413" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">PayPal / Venmo / Bank</text>
  </g>

  <!-- Row 6: data stores -->
  <g>
    <rect x="30" y="470" width="670" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="365" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Postgres</text>
    <text x="365" y="513" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">expenses, balances, settlements</text>

    <rect x="720" y="470" width="210" height="60" rx="8" fill="var(--surface-2, #1f1f22)" stroke="var(--border-strong, #3a3a3e)"/>
    <text x="825" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-primary, #f2f2f3)">Redis</text>
    <text x="825" y="513" text-anchor="middle" font-size="10" fill="var(--text-secondary, #8a8a8e)">FX rate cache</text>
  </g>
</svg>
